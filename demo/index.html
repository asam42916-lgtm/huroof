<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A2A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حروف المناسبة">
<title>حروف المناسبة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF4EA;--card:#fff;--ink:#3A2A1E;--muted:#8A7462;--line:#EADBC8;--ok:#2E9E5B;--bad:#D64545;--story:#FFF3D6;--storyLine:#E9B949}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-size:18px;font-weight:700;padding:16px 18px;min-height:56px;transition:transform .08s}
button:active{transform:scale(.97)}
.btn{width:100%;display:block;margin-top:10px}
.big{min-height:64px;font-size:21px}
.primary{background:linear-gradient(135deg,#3A2A1E,#6B4A33);color:#fff}
.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.soft{background:#F3E6D6;color:var(--ink)}
.ok{background:var(--ok);color:#fff}
.bad{background:var(--bad);color:#fff}
.small{min-height:46px;padding:10px 14px;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
input{width:100%;font-family:inherit;font-size:19px;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:8px}
.hero{text-align:center;padding:26px 12px 22px;margin-bottom:14px;border-radius:24px;background:linear-gradient(160deg,#3A2A1E,#7A5236);color:#fff}
.hero-icon{font-size:44px;color:#E9B949;line-height:1}
.hero-title{font-size:32px;font-weight:800;line-height:1.35;margin-top:6px}
.hero-sub{font-size:18px;opacity:.9;margin-top:6px}
.warn{background:#FFF0E0;border:2px solid #E9A24C;border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:700;line-height:1.6;text-align:center}
.team-card{border-width:3px}
.team-dir{font-weight:800;font-size:18px}
.swatches{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.sw{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.back{background:none;color:var(--bad);font-size:16px;min-height:44px;padding:8px 4px}
.mute{background:#F3E6D6;font-size:20px;min-height:44px;width:48px;padding:0;border-radius:12px}
.topbar .turn{margin-inline-start:auto}
.turn{color:#fff;font-weight:800;font-size:20px;padding:10px 18px;border-radius:999px}
.legend{display:flex;justify-content:center;gap:18px;font-weight:700;margin:4px 0 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-left:6px;vertical-align:middle}
.board{border:10px solid;border-radius:16px;background:#fff;padding:10px 6px}
.board svg{width:100%;height:auto;max-height:68vh;display:block;margin:0 auto}
.cell text{font-family:"Tajawal",system-ui,sans-serif;font-weight:800;font-size:40px;pointer-events:none}
.cell.free{cursor:pointer}
.cell.free:hover polygon{filter:brightness(.95)}
.cell.win polygon{animation:glow 1s ease infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
.hint{color:var(--muted);text-align:center;margin:10px 0;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(30,20,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet-box{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px}
.sheet.anim .sheet-box{animation:up .25s ease}
@media(min-width:700px){.sheet{align-items:center}.sheet-box{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.big-letter{width:84px;height:84px;margin:0 auto 10px;border:5px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;background:#fff}
.who{color:#fff;text-align:center;font-weight:800;font-size:20px;border-radius:14px;padding:10px}
.passed{text-align:center;color:var(--bad);font-weight:800;margin-bottom:6px}
.qtext{font-size:30px;font-weight:800;text-align:center;line-height:1.5;padding:20px 8px}
.letter-hint{text-align:center;font-size:20px;color:var(--muted);margin-bottom:6px}
.letter-hint b{color:var(--ink);font-size:24px}
.judge{margin-top:12px}.judge button{min-height:78px;font-size:22px}
.verdict{text-align:center;font-weight:800;font-size:21px;margin:4px 0 8px}
.answer{background:#EAF6EE;border:2px solid var(--ok);border-radius:16px;padding:14px;text-align:center}
.answer .lb{color:var(--ok);font-weight:700;font-size:15px}
.answer .v{font-size:30px;font-weight:800;margin-top:4px}
.story{background:var(--story);border:2px dashed var(--storyLine);border-radius:20px;padding:18px;margin-top:12px}
.story .lb{font-weight:800;color:#9A6B00;font-size:17px;margin-bottom:8px}
.story .tx{font-size:23px;line-height:1.75;white-space:pre-wrap}
.winner{text-align:center;padding:14px 10px 18px}
.winner .cup{font-size:80px;animation:pop .7s ease}
.winner .wl{color:var(--muted);font-weight:700;font-size:18px}
.winner .nm{font-size:38px;font-weight:800;margin:4px 0}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:rgba(40,25,15,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal .box{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%}
.modal p{font-size:19px;margin:0 0 14px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="app.js"></script>
</body>
</html>
